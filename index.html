<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pincode Information Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="bg-light">
    
    <div class="scene">
        <div class="background-scroller"></div>
        <img src="image/truck.webp" class="truck img-fluid" alt="Truck">
    </div>

    <div class="container my-4">
        <h1 id="mainHeading" class="text-center fw-bold">Pincode Information Finder</h1>
        <p class="subtitle text-center" id="mainSubtitle">
            Enter any valid Indian Pincode to view Post Office details.
        </p>

        <div class="main-layout row justify-content-center">
            <div class="center-section col-12 col-md-8 col-lg-9">
                <div class="search-card card p-4 shadow-sm">
                    
                    <button class="toggle-btn btn  w-100 mb-3" id="modeToggle">Don't know your Pincode??</button>

                    <div id="pincodeSearchBox" class="search-box input-group mb-3">
                        <input type="text" id="pincode" class="form-control" placeholder="Enter 6-digit Pincode" maxlength="6">
                        <button id="searchBtn" class="btn btn-primary">Search</button>
                    </div>

                    <div id="locationSearchBox" class="location-box hidden">
                        <div class="input-group mb-3">
                            <label class="input-group-text" for="stateSelect">State</label>
                            <select id="stateSelect" class="form-select">
                                <option value="All">All States</option>
                                <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
                                <option value="Andhra Pradesh">Andhra Pradesh</option>
                                <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                                <option value="Assam">Assam</option>
                                <option value="Bihar">Bihar</option>
                                <option value="Chandigarh">Chandigarh</option>
                                <option value="Chhattisgarh">Chhattisgarh</option>
                                <option value="Delhi">Delhi</option>
                                <option value="Goa">Goa</option>
                                <option value="Gujarat">Gujarat</option>
                                <option value="Haryana">Haryana</option>
                                <option value="Himachal Pradesh">Himachal Pradesh</option>
                                <option value="Jammu and Kashmir">Jammu and Kashmir</option>
                                <option value="Jharkhand">Jharkhand</option>
                                <option value="Karnataka">Karnataka</option>
                                <option value="Kerala">Kerala</option>
                                <option value="Madhya Pradesh">Madhya Pradesh</option>
                                <option value="Maharashtra">Maharashtra</option>
                                <option value="Manipur">Manipur</option>
                                <option value="Meghalaya">Meghalaya</option>
                                <option value="Mizoram">Mizoram</option>
                                <option value="Nagaland">Nagaland</option>
                                <option value="Odisha">Odisha</option>
                                <option value="Punjab">Punjab</option>
                                <option value="Rajasthan">Rajasthan</option>
                                <option value="Sikkim">Sikkim</option>
                                <option value="Tamil Nadu">Tamil Nadu</option>
                                <option value="Telangana">Telangana</option>
                                <option value="Tripura">Tripura</option>
                                <option value="Uttar Pradesh">Uttar Pradesh</option>
                                <option value="Uttarakhand">Uttarakhand</option>
                                <option value="West Bengal">West Bengal</option>
                            </select>
                        </div>

                        <div class="input-group mb-3">
                            <label class="input-group-text" for="districtInput">District / City</label>
                            <input type="text" id="districtInput" class="form-control" placeholder>
                        </div>

                        <div class="input-group mb-3">
                            <label class="input-group-text" for="areaInput">Area / Post Office Name</label>
                            <input type="text" id="areaInput" class="form-control" list="areaSuggestions" placeholder>
                            <datalist id="areaSuggestions"></datalist>
                        </div>

                        <button id="findPinBtn" class="primary-btn btn btn-primary w-100">Find Pincode</button>
                    </div>

                    <div id="loading" class="loading hidden text-center my-3">
                        <div class="spinner spinner-border text-primary"></div>
                        <p id="loadingText" class="mt-2 text-muted">Searching postal database...</p>
                    </div>

                    <div id="error" class="error alert alert-danger hidden" role="alert"></div>

                    <div id="multipleResultsBox" class="multiple-results hidden mb-3">
                        <label for="postOfficeSelect" class="form-label fw-bold">Multiple Post Offices Found. Select One:</label>
                        <select id="postOfficeSelect" class="form-select"></select>
                    </div>

                    <div id="resultCard" class="result-card card card-body mt-3 hidden">
                        <h2 id="resultHeading" class="h5 border-bottom pb-2">Post Office Details</h2>
                        <div class="result-row d-flex justify-content-between py-1 border-bottom"><span class="label">Post Office</span><span id="officeName">-</span></div>
                        <div class="result-row d-flex justify-content-between py-1 border-bottom"><span class="label">Pincode</span><span id="pinValue" class="pin-highlight fw-bold text-primary">-</span></div>
                        <div class="result-row d-flex justify-content-between py-1 border-bottom"><span class="label">Delivery Status</span><span id="deliveryStatus" class="status">-</span></div>
                        <div class="result-row d-flex justify-content-between py-1 border-bottom"><span class="label">District</span><span id="district">-</span></div>
                        <div class="result-row d-flex justify-content-between py-1 border-bottom"><span class="label">State</span><span id="state">-</span></div>
                        <div class="result-row d-flex justify-content-between py-1 border-bottom"><span class="label">Branch Type</span><span id="branchType">-</span></div>
                        <div class="result-row d-flex justify-content-between py-1 border-bottom"><span class="label">Region</span><span id="region">-</span></div>
                        <div class="result-row d-flex justify-content-between py-1"><span class="label">Division</span><span id="division">-</span></div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
